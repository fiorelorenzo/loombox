# Pins the JDK apps/mobile's Android build needs (issue #951, found running
# the #281 spike). Capacitor 8.5.0's Android Gradle Plugin requires JDK 21;
# this devbox's (and most engineers') machine-level mise default is JDK 17
# (`~/.config/mise/config.toml`), which fails `./gradlew assembleDebug` /
# `bundleRelease` outright with an opaque "invalid source release: 21" --
# see docs/superpowers/specs/2026-08-08-capacitor-mobile-spike.md for the
# full transcript that first hit this.
#
# mise layers per-directory config over the global one, discovered by
# walking up from the current directory -- so anyone running a `./gradlew`
# command from inside apps/mobile/ (including apps/mobile/android/, the
# gitignored generated project) picks this up automatically, with no env
# var to remember and no change to the machine-level default other
# packages on this shared box still depend on. CI does not read this file;
# .github/workflows/ci.yml and release-mobile.yml pin JDK 21 directly via
# actions/setup-java, which needs no mise activation on a fresh runner.
[tools]
java = "temurin-21"
