name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm test

  e2e:
    name: e2e (Playwright, apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright's Chromium (with OS deps)
        run: pnpm --filter @loombox/web exec playwright install --with-deps chromium

      - name: Run Playwright e2e specs
        run: pnpm --filter @loombox/web run e2e

      - name: Upload Playwright report (traces/screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  licenses:
    name: license scan (no AGPL/GPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail on AGPL/GPL-family licenses
        run: pnpm license:check

  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificate in CI; --dir output below is never signed or
      # notarized (that stays a Lorenzo's-Mac-only step, see
      # apps/desktop/README.md).
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # windows-latest's default shell is PowerShell, where `&&` chaining
      # and the rest of this workflow's POSIX-flavored commands don't behave
      # the same way the ubuntu/macos legs expect, so every run step below
      # pins `shell: bash` (Git for Windows ships one on the runner image)
      # to keep all three legs on one code path.
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # Every icon under apps/web/static and apps/desktop/assets is
      # generated by apps/web/scripts/gen-brand-assets.mjs from one locked
      # vector mark; nothing else stops a hand-edited PNG from drifting out
      # from under it. Regenerate and diff on all three legs, not a
      # dedicated ubuntu-only job: resvg's raster output was verified
      # byte-identical across linux/x64, windows/x64 and macos/arm64 on this
      # workflow's own PR run (see the PR description for the run link) —
      # the SVG source here has no text, so nothing here touches a system
      # font or another OS-specific rendering path, and the deps this step
      # needs are already installed by the step above, so it costs only the
      # ~1-2s the generator itself takes on each leg.
      - name: Regenerate brand assets
        shell: bash
        run: pnpm --filter @loombox/web exec node scripts/gen-brand-assets.mjs

      - name: Fail on brand-asset drift
        shell: bash
        run: git diff --exit-code -- apps/web/static apps/desktop/assets

      - name: Typecheck (@loombox/desktop)
        shell: bash
        run: pnpm --filter @loombox/desktop typecheck

      - name: Test (@loombox/desktop)
        shell: bash
        run: pnpm --filter @loombox/desktop test

      # --dir only: an unpacked build, no installer/dmg. Defaults to the
      # host platform/arch with no -m/-l/-w flag (electron-builder's own
      # CLI help: "Defaults to current platform" when none is given).
      - name: Package (--dir, unsigned)
        shell: bash
        run: pnpm --filter @loombox/desktop exec electron-builder --dir
