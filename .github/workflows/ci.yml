name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · format · brand-asset drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every icon under apps/web/static and apps/desktop/assets is
      # generated by apps/web/scripts/gen-brand-assets.mjs from one locked
      # vector mark; nothing else stops a hand-edited PNG from drifting out
      # from under it. Runs here (ubuntu only, every push and PR) rather
      # than in the desktop matrix below: resvg's raster output was
      # verified byte-identical across linux/x64, windows/x64 and
      # macos/arm64 on this workflow's own PR run (see PR #607's
      # description for the evidence and run links), so paying the
      # macOS/Windows billing multiplier for a check that never differs
      # there would be pure waste.
      - name: Regenerate brand assets
        run: pnpm --filter @loombox/web exec node scripts/gen-brand-assets.mjs

      - name: Fail on brand-asset drift
        run: git diff --exit-code -- apps/web/static apps/desktop/assets

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  e2e:
    name: e2e (Playwright, apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright's Chromium (with OS deps)
        run: pnpm --filter @loombox/web exec playwright install --with-deps chromium

      - name: Run Playwright e2e specs
        run: pnpm --filter @loombox/web run e2e

      - name: Upload Playwright report (traces/screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  licenses:
    name: license scan (no AGPL/GPL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail on AGPL/GPL-family licenses
        run: pnpm license:check

  changes:
    name: detect desktop-relevant changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - name: Check whether this PR touches desktop-relevant paths
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            # A push to main always runs the full matrix regardless of the
            # filter below - a change that slipped through it on some PR
            # still gets caught here, on the integration branch, rather
            # than at release time.
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          echo "$changed"
          if echo "$changed" | grep -Eq '^(apps/desktop/|apps/web/scripts/gen-brand-assets\.mjs$|apps/web/static/|pnpm-lock\.yaml$|\.github/workflows/ci\.yml$)'; then
            echo "desktop=true" >> "$GITHUB_OUTPUT"
          else
            echo "desktop=false" >> "$GITHUB_OUTPUT"
          fi

  desktop:
    name: desktop (${{ matrix.os }})
    needs: changes
    # Full matrix on every push to main regardless of the filter (see the
    # changes job above); on a PR, only when it touches something the
    # packaged app or its brand assets actually depend on. The macOS leg
    # alone is a 10x billing multiplier on this private repo (see PR #607),
    # so a typical PR that doesn't touch apps/desktop or the icon generator
    # pays none of it.
    if: github.event_name == 'push' || needs.changes.outputs.desktop == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      # No signing certificate in CI; --dir output below is never signed or
      # notarized (that stays a Lorenzo's-Mac-only step, see
      # apps/desktop/README.md).
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # windows-latest's default shell is PowerShell, where `&&` chaining
      # and the rest of this workflow's POSIX-flavored commands don't behave
      # the same way the ubuntu/macos legs expect, so every run step below
      # pins `shell: bash` (Git for Windows ships one on the runner image)
      # to keep all three legs on one code path.
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Typecheck (@loombox/desktop)
        shell: bash
        run: pnpm --filter @loombox/desktop typecheck

      - name: Test (@loombox/desktop)
        shell: bash
        run: pnpm --filter @loombox/desktop test

      # --dir only: an unpacked build, no installer/dmg. Defaults to the
      # host platform/arch with no -m/-l/-w flag (electron-builder's own
      # CLI help: "Defaults to current platform" when none is given).
      - name: Package (--dir, unsigned)
        shell: bash
        run: pnpm --filter @loombox/desktop exec electron-builder --dir
