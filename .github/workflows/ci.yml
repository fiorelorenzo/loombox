name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes. event_name is in
# the group (not just ref) so a PR run and a push run never share one, even
# though in practice a PR's ref (refs/pull/N/merge) never collides with a
# branch ref anyway - this keeps the estate's workflows uniform.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PR-only, and deliberately no checkout: dorny/paths-filter answers from
  # the GitHub API for a pull_request event, which costs a few seconds. A
  # push always runs everything below regardless of this output (see each
  # job's `if:`), so main is never gated by a path filter.
  changes:
    name: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'apps/**'
              - 'packages/**'
              - 'scripts/**'
              - 'tooling/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - 'eslint.config.js'
              - '.prettierrc.json'
              - 'vitest.config.ts'
              - '.github/workflows/ci.yml'
              - '.github/preflight.json'

  # Tier 2: the PR-path gate. Runs scoped to `changes.outputs.code` on a PR
  # (a docs-only PR skips it entirely - `preflight` already covers the same
  # ground before the push) and unconditionally on push, where path filters
  # never apply. Steps below are lint/format first: those two caused 16 of
  # ~41 real CI failures in this estate's audit, and a formatter fixes in
  # seconds what a rerun costs in minutes, so the cheap, common failure
  # surfaces before the slower brand-asset regeneration does.
  checks:
    name: lint · format · brand-asset drift
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      # Every icon under apps/web/static and apps/desktop/assets is
      # generated by apps/web/scripts/gen-brand-assets.mjs from one locked
      # vector mark; nothing else stops a hand-edited PNG from drifting out
      # from under it. Runs here (ubuntu only, every push and PR) rather
      # than in the desktop matrix: resvg's raster output was verified
      # byte-identical across linux/x64, windows/x64 and macos/arm64 on
      # this workflow's own PR run (see PR #607's description for the
      # evidence and run links), so paying the macOS/Windows billing
      # multiplier for a check that never differs there would be pure
      # waste.
      - name: Regenerate brand assets
        run: pnpm --filter @loombox/web exec node scripts/gen-brand-assets.mjs

      - name: Fail on brand-asset drift
        run: git diff --exit-code -- apps/web/static apps/desktop/assets

  typecheck:
    name: typecheck
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

  test:
    name: test
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  licenses:
    name: license scan (no AGPL/GPL)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fail on AGPL/GPL-family licenses
        run: pnpm license:check

  # Tier 3: main-only. A PR author acts on nothing this job reports that
  # `preflight`'s own e2e check (`.github/preflight.json`) didn't already
  # tell them before the push, and it was 2.5 minutes of every PR's runner
  # time for that. It still runs on every push to main as the deploy gate.
  e2e:
    name: e2e (Playwright, apps/web)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright's Chromium (with OS deps)
        run: pnpm --filter @loombox/web exec playwright install --with-deps chromium

      - name: Run Playwright e2e specs
        run: pnpm --filter @loombox/web run e2e

      - name: Upload Playwright report (traces/screenshots on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Tier 3: main-only, full three-OS matrix, no path filter - the audit
  # found this was the single clearest waste on every PR (7.3 minutes of
  # runner time across the matrix, and a PR author acts on none of it: the
  # macOS/Windows legs never differ from what `preflight`'s local desktop
  # build already proved on the host platform). `preflight`'s `desktop`
  # check (`.github/preflight.json`) is the PR-path substitute; this stays
  # the release gate for the two platforms nothing here can build.
  desktop:
    name: desktop (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      # No signing certificate in CI; --dir output below is never signed or
      # notarized (that stays a Lorenzo's-Mac-only step, see
      # apps/desktop/README.md).
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # windows-latest's default shell is PowerShell, where `&&` chaining
      # and the rest of this workflow's POSIX-flavored commands don't behave
      # the same way the ubuntu/macos legs expect, so every run step below
      # pins `shell: bash` (Git for Windows ships one on the runner image)
      # to keep all three legs on one code path.
      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Typecheck (@loombox/desktop)
        shell: bash
        run: pnpm --filter @loombox/desktop typecheck

      - name: Test (@loombox/desktop)
        shell: bash
        run: pnpm --filter @loombox/desktop test

      # --dir only: an unpacked build, no installer/dmg. Defaults to the
      # host platform/arch with no -m/-l/-w flag (electron-builder's own
      # CLI help: "Defaults to current platform" when none is given).
      - name: Package (--dir, unsigned)
        shell: bash
        run: pnpm --filter @loombox/desktop exec electron-builder --dir

  # The single required status check. Never rename it: it is the one context
  # in the branch ruleset, so the jobs above can be renamed, split or moved
  # between tiers forever without a ruleset edit. `skipped` counts as
  # passing - that's what makes a docs-only PR (every job above skips) or a
  # PR-path run (e2e/desktop skip by design) come out green.
  ci:
    name: ci
    if: always()
    needs: [changes, checks, typecheck, test, licenses, e2e, desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: A needed job failed or was cancelled
        run: |
          printf '%s\n' '${{ toJSON(needs) }}'
          printf '%s' '${{ toJSON(needs) }}' | jq -e '
            to_entries
            | map(select(.value.result == "failure" or .value.result == "cancelled"))
            | length == 0'
