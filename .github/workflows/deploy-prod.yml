name: deploy-prod

# Ships an exact tagged commit to prodbox. Push a `vX.Y.Z` tag on main (see
# CONTRIBUTING.md#deploying-to-prod for the full flow, what to check once
# it's live, and how to roll back by hand) and this takes it from there.
on:
  push:
    tags: ['v*']

# Its own group, separate from CI's ci-${{ github.ref }} and the release
# workflow's release-${{ github.ref }} — a tag push and a main push are
# different refs anyway, but this keeps prod deploys serialized against each
# other specifically. cancel-in-progress is false on purpose: by the time
# this workflow is running the `deploy` job, it may already have flipped
# releases/current or be mid-way through a relay image rebuild. Cancelling
# there would abandon prod half-updated, with no health gate having run and
# no rollback triggered — strictly worse than letting it finish, since
# scripts/deploy-prod.sh rolls itself back on failure but has no way to
# recover from being killed outright. A second tag pushed while one is
# running queues instead (GitHub keeps only the newest pending run per group
# when cancel-in-progress is false) and starts once the first finishes.
concurrency:
  group: prod-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # the deploy job reads the CI workflow's conclusion for this tag before touching prod

jobs:
  build-web:
    name: build web bundle
    runs-on: ubuntu-latest
    # Built here, not on prodbox: prodbox has 4 shared vCPUs and also hosts
    # pitchbox and embertold, so the monorepo install and the SvelteKit build
    # (which needs the whole workspace resolved, not just @loombox/web) stay
    # off it. Only the small, already-built apps/web/build/ output ships to
    # prod as an artifact.
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @loombox/web
        run: pnpm --filter @loombox/web build

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/build/
          retention-days: 14

  deploy:
    name: deploy to prodbox
    needs: build-web
    runs-on: [self-hosted, prodbox]
    steps:
      # Tags are pushed by hand, and nothing else stops someone tagging a
      # commit CI never ran on, or already failed on: this repo is private
      # free-tier, so there's no branch-protection "required check", and per
      # AGENTS.md the merge gate here is procedural (CI runs on every PR,
      # main is kept green by discipline, not by GitHub enforcing it). This
      # is the one automated backstop between an untested/red commit and
      # prod, so it runs first, before checkout or anything else here.
      #
      # curl + jq, not `gh api`: confirmed by hand that this runner's PATH
      # (/usr/local/bin:/usr/bin:/bin, set by its .path file) has no `gh` —
      # it was never installed alongside the runner, unlike git/docker/
      # rsync/curl/tar/jq/sha256sum, which are all actually there.
      #
      # Scoped to the ci.yml WORKFLOW specifically (workflow_id can be the
      # file name) rather than the repo-wide /repos/.../actions/runs list:
      # the repo-wide endpoint also filtered by head_sha returns every
      # workflow's run for that commit, and checked live against this repo
      # while writing this step, the SAME commit had a successful ci.yml run
      # sitting right next to a failed release.yml run (an unrelated
      # Changesets hiccup). Querying the repo-wide list and trusting
      # whichever run sorts newest would have blocked (or worse, allowed) a
      # deploy for the wrong reason. Asking for ci.yml specifically avoids
      # ever conflating the two.
      - name: Verify CI passed for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          url="https://api.github.com/repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${SHA}&per_page=10"
          resp="$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$url")"
          run="$(echo "$resp" | jq -c '.workflow_runs | sort_by(.created_at) | last // empty')"
          if [ -z "$run" ]; then
            echo "::error::No CI (ci.yml) run found for commit $SHA. Refusing to deploy an untested tag."
            exit 1
          fi
          status="$(echo "$run" | jq -r '.status')"
          conclusion="$(echo "$run" | jq -r '.conclusion')"
          html_url="$(echo "$run" | jq -r '.html_url')"
          echo "ci.yml for $SHA: status=$status conclusion=$conclusion ($html_url)"
          if [ "$status" != completed ] || [ "$conclusion" != success ]; then
            echo "::error::CI is not a completed success for $SHA (status=$status, conclusion=$conclusion). See $html_url. Refusing to deploy."
            exit 1
          fi
          echo "CI verified green for $SHA -- proceeding"

      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Download web bundle
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: ${{ runner.temp }}/web-build

      # No pnpm install here on purpose (non-goal): this job only unpacks
      # the artifact build-web already produced and drives docker/rsync —
      # scripts/deploy-prod.sh never touches node/pnpm, since this runner
      # has neither on PATH (it bundles its own Node internally, just for
      # running JS-based actions like the ones above).
      - name: Deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
        run: scripts/deploy-prod.sh "${{ github.ref_name }}" "${{ runner.temp }}/web-build"
